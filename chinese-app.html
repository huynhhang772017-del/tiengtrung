      </div>
    </div>`;
}

function updateSuggestions(query){
  const sugg = document.getElementById("sugg");
  if(!sugg) return;
  const q = (query||"").trim();

  // Nếu có query → search trong PHRASE_BANK
  if(q.length >= 1){
    const hits = searchPhrases(q, 8);
    if(hits.length){
      sugg.innerHTML =
        `<p style="color:var(--muted);font-size:12px;margin:0 0 8px">🔎 ${hits.length} gợi ý cho "<b>${q}</b>"</p>` +
        hits.map(phraseCardHTML).join("") +
        `<p style="color:var(--muted);font-size:11px;margin-top:4px">💡 Bấm 🔊 để nghe, bấm <b>Dùng</b> để chèn vào ô chat</p>`;
      return;
    } else {
      sugg.innerHTML = `
        <p style="color:var(--muted);font-size:12px">Không tìm thấy câu tiếng Trung phù hợp với "<b>${q}</b>".</p>
        <p style="color:var(--muted);font-size:11px">Thử gõ các từ khóa ngắn như: "xin chào", "cảm ơn", "bao nhiêu tiền", "giúp tôi"…</p>`;
      return;
    }
  }

  // Không có query → gợi ý mặc định theo scenario
  const sc = chatState && chatState.scenario;
  if(!sc){ sugg.innerHTML = ""; return; }
  const picks = (sc.responses||[]).slice(0, 4).map(r => ({
    h: r.h, p: r.p || "", m: r.m || "", tag: "tình huống"
  })).filter(x => x.h);
  let html = `<p style="color:var(--muted);font-size:12px;margin:0 0 8px">💡 Câu gợi ý cho ngữ cảnh <b>${sc.emo||""}</b></p>`;
  html += picks.map(phraseCardHTML).join("");
  html += `<p style="color:var(--muted);font-size:11px;margin-top:4px">Hoặc gõ tiếng Việt bên dưới để dịch câu bạn muốn nói.</p>`;
  sugg.innerHTML = html;
}

window.sendChat = function(){
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if(!text) return;
  input.value = "";
  addChatMsg("me", {h:text});
  const sc = chatState.scenario;
  // Tìm phản hồi
  let response = null;
  for(const r of sc.responses){
    if(r.trig.some(t=>text.toLowerCase().includes(t.toLowerCase()))){
      response = r; break;
    }
  }
  if(!response) response = sc.fallback;
  setTimeout(()=>{ addChatMsg("ai", response); addXP(3); saveState(); }, 500);
};

window.chatListen = function(){
  const mic = document.getElementById("chatMic");
  const ms = document.getElementById("chatMs");
  mic.classList.add("rec");
  ms.textContent = "🎙️ Đang nghe...";
  listenOnce((text)=>{

    document.getElementById("chatInput").value = text;
    setTimeout(sendChat, 400);
  }, ()=>mic.classList.remove("rec"));
};

function pickRandom(arr, n){
  const copy = [...arr].sort(()=>Math.random()-0.5);
  return copy.slice(0,n);
}

function buildQuiz(){
  const pool = VOCAB;
  const qs = [];
  // 3 câu chọn nghĩa
  pickRandom(pool, 3).forEach(v=>{
    const distract = pickRandom(pool.filter(x=>x.m!==v.m), 3).map(x=>x.m);
    const opts = [...distract, v.m].sort(()=>Math.random()-0.5);
    qs.push({type:"meaning", q:`"${v.h}" (${v.p}) nghĩa là gì?`, opts, correct:v.m, word:v});
  });
  // 2 câu chọn chữ Hán từ pinyin
  pickRandom(pool, 2).forEach(v=>{
    const distract = pickRandom(pool.filter(x=>x.h!==v.h), 3).map(x=>x.h);
    const opts = [...distract, v.h].sort(()=>Math.random()-0.5);
    qs.push({type:"hanzi", q:`Chữ Hán cho "${v.p}" (${v.m}) là?`, opts, correct:v.h, word:v});
  });
  // 2 câu nghe và chọn
  pickRandom(pool, 2).forEach(v=>{
    const distract = pickRandom(pool.filter(x=>x.h!==v.h), 3).map(x=>x.h);
    const opts = [...distract, v.h].sort(()=>Math.random()-0.5);
    qs.push({type:"listen", q:`Bấm 🔊 và chọn từ bạn nghe được:`, opts, correct:v.h, word:v, playword:v.h});
  });
  // 1 câu nói
  const sv = pickRandom(pool, 1)[0];
  qs.push({type:"speak", q:`Hãy phát âm từ sau:`, word:sv, correct:sv.h});
  return qs;
}

let Q = null;
function startQuiz(){
  Q = {questions:buildQuiz(), current:0, correct:0, answers:[]};
  renderQuiz();
}
function renderQuiz(){
  const box = document.getElementById("quizBox");
  if(Q.current >= Q.questions.length){
    return finishQuiz();
  }
  const q = Q.questions[Q.current];
  const progress = ((Q.current)/Q.questions.length*100)|0;
  let body = "";
  if(q.type==="listen"){
    body = `<button class="btn btn-pri" onclick="speak('${q.playword}')">🔊 Phát lại</button>
      <div style="margin-top:14px">${q.opts.map((o,i)=>`<button class="quiz-opt" onclick="answerQuiz('${o}')">${o}</button>`).join("")}</div>`;
    setTimeout(()=>speak(q.playword), 300);
  } else if(q.type==="speak"){
    body = `
      <div style="text-align:center">
        <div class="hanzi">${q.word.h}</div>
        <div class="pinyin">${q.word.p}</div>
        <div class="meaning">${q.word.m}</div>
        <button class="btn btn-ghost" onclick="speak('${q.word.h}')">🔊 Nghe mẫu</button>
        <button class="mic-big" id="qmic" onclick="quizSpeak('${q.word.h}')">🎙️</button>
        <div class="mic-status" id="qms">Nhấn mic và nói theo</div>
      </div>`;
  } else {
    body = `<div>${q.opts.map(o=>`<button class="quiz-opt" onclick="answerQuiz('${o}')">${o}</button>`).join("")}</div>`;
  }
  box.innerHTML = `
    <div class="card">
      <div class="bar"><i style="width:${progress}%"></i></div>
      <p class="sub" style="margin:6px 0">Câu ${Q.current+1}/${Q.questions.length}</p>
      <h3>${q.q}</h3>
      ${body}
    </div>
  `;
}
window.answerQuiz = function(choice){
  const q = Q.questions[Q.current];
  const ok = (choice===q.correct);
  if(ok) Q.correct++;
  else {
    S.mistakes.push({h:q.word.h, p:q.word.p, m:q.word.m, type:q.type, date:new Date().toISOString(), count:1});
  }
  Q.answers.push({q, choice, ok});
  // Highlight đáp án đúng/sai
  document.querySelectorAll(".quiz-opt").forEach(btn=>{
    btn.disabled = true;
    btn.style.pointerEvents = "none";
    const val = btn.textContent.trim();
    if(val===q.correct) btn.style.background = "#dcfce7", btn.style.border = "2px solid #22c55e", btn.style.fontWeight = "700";
    else if(val===choice && !ok) btn.style.background = "#fee2e2", btn.style.border = "2px solid #ef4444";
    else btn.style.opacity = "0.4";
  });
  // Hiện feedback bên dưới
  const box = document.getElementById("quizBox");
  const fb = document.createElement("div");
  fb.className = "card";
  fb.style.marginTop = "12px";
  fb.style.textAlign = "center";
  fb.style.background = ok ? "#f0fdf4" : "#fff7ed";
  fb.style.border = ok ? "2px solid #22c55e" : "2px solid #f97316";
  const w = q.word;
  fb.innerHTML = `
    <div style="font-size:22px;font-weight:700;color:${ok?'#22c55e':'#ef4444'}">${ok?'✅ Đúng rồi!':'❌ Sai rồi!'}</div>
    <div style="margin:10px 0">
      <span style="font-size:28px;color:var(--pri)">${w.h}</span>
      <div style="color:var(--muted);font-size:15px;margin:4px 0">${w.p}</div>
      <div style="font-size:15px">${w.m}</div>
    </div>
    <button class="btn btn-ghost" onclick="speak('${w.h}')">🔊 Nghe phát âm</button>
  `;
  box.appendChild(fb);
  // Phát âm tự động
  speak(w.h);
  Q.current++;
  setTimeout(renderQuiz, ok ? 1800 : 3000);
};
window.quizSpeak = function(target){
  const qms = document.getElementById("qms");
  document.getElementById("qmic").classList.add("rec");
  qms.innerHTML = "🎙️ Đang nghe...";
  listenOnce((text)=>{
    const r = scorePronunciation(target, text);
    const ok = r.score>=70;
    if(ok) Q.correct++;
    else S.mistakes.push({h:target, type:"pronunciation", date:new Date().toISOString(), count:1});
    Q.answers.push({q:Q.questions[Q.current], choice:text, ok, score:r.score});
    const w = Q.questions[Q.current].word;
    document.getElementById("qmic").classList.remove("rec");
    qms.innerHTML = `
      <div style="font-size:20px;font-weight:700;color:${ok?'#22c55e':'#ef4444'};margin-bottom:8px">${ok?'✅ Đúng!':'❌ Chưa chuẩn!'}</div>
      <div><b style="color:${ok?'var(--ok)':'var(--pri)'}">${r.score}/100</b> – ${r.detail}</div>
      <div style="color:var(--muted);font-size:13px;margin-top:4px">Bạn nói: "${r.recognized||text}"</div>
      <div style="margin-top:8px">
        <span style="font-size:22px;color:var(--pri)">${w.h}</span>
        <span style="color:var(--muted);margin-left:8px">${w.p}</span>
      </div>
      <button class="btn btn-ghost" onclick="speak('${w.h}')" style="margin-top:6px">🔊 Nghe lại mẫu</button>
    `;
    speak(w.h);
    Q.current++;
    setTimeout(renderQuiz, ok ? 2500 : 4000);
  }, ()=>document.getElementById("qmic").classList.remove("rec"));
};
function finishQuiz(){
  const score = Math.round(Q.correct/Q.questions.length*100);
  S.quizHistory.push({date:new Date().toISOString().slice(0,10), score, total:Q.questions.length});
  S.dailyDone = new Date().toISOString().slice(0,10);
  addXP(30 + Q.correct*5);
  saveState();
  setTimeout(function(){ showNextStepToast("Daily Quiz ("+score+"%)"); }, 1000);
  const errs = Q.answers.filter(a=>!a.ok).slice(0,3);
  document.getElementById("quizBox").innerHTML = `
    <div class="card" style="text-align:center">
      <h2>Kết quả Daily Quiz</h2>
      <div class="score-circle" style="background:conic-gradient(var(--pri) 0% ${score}%, #e2e8f0 ${score}% 100%)">${score}</div>
      <p style="margin:16px 0">Đúng <b>${Q.correct}/${Q.questions.length}</b> · +${30+Q.correct*5} XP</p>
      ${errs.length?`
        <div class="panel" style="text-align:left;background:#fff7ed">
          <b>⚠️ Câu sai:</b>

// Helper: lấy câu của ngày hôm nay theo seed date (ổn định)
function getLazyToday(){
  const today = new Date().toISOString().slice(0,10);
  // seed = days since epoch (đảm bảo mỗi ngày khác nhau)
  const seed = Math.floor(new Date(today).getTime()/(1000*60*60*24));
  const idx = seed % LAZY_POOL.length;
  return {date: today, item: LAZY_POOL[idx], idx};
}

function getLazyStreak(){
  // Đếm chuỗi ngày liên tiếp đã tick lazyDone
  let streak = 0;
  let d = new Date();
  while(true){
    const ds = d.toISOString().slice(0,10);
    if(S.lazyDone[ds]){ streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  return streak;
}

window.lazyPlay = function(rate){
  const {date, item} = getLazyToday();
  speak(item.h, rate?{rate}:{});
  const cnt = (S.lazyPlayCount[date] || 0);
  if(cnt < 10){ // giới hạn tối đa
    S.lazyPlayCount[date] = cnt + 1;
    saveState();
  }
  // Re-render để cập nhật đếm
  if((S.lazyPlayCount[date]||0) <= 3) render("lazy");
};

window.lazyListen = function(){
  const {item} = getLazyToday();
  const el = document.getElementById("lazyMic");
  el.textContent = "🎙️ Đang nghe...";
  listenOnce((text)=>{
    const r = scorePronunciation(item.h, text);
    const color = r.score>=80?'#166534':r.score>=50?'#ca8a04':'#991b1b';
    el.innerHTML = `<span style="color:${color}"><b>${r.score}/100</b> · ${r.detail}</span>`;
    if(r.score>=70){ addXP(3); }
  }, ()=>{
    if(!el.innerHTML.includes('bạn nói')&&!el.innerHTML.includes('/100')) el.textContent = "Không nghe được âm.";
  });
};

window.lazyComplete = function(){
  const {date} = getLazyToday();
  if(!S.lazyDone[date]){
    S.lazyDone[date] = true;
    addXP(10);
    S.lazySnoozeUntil = null;
    saveState();
    // Hiệu ứng celebration
    const msgs = [
      "🎉 Tuyệt vời! Streak của bạn đang lên!",

window.lazySnooze = function(){
  S.lazySnoozeUntil = Date.now() + 2*60*60*1000; // 2 giờ sau
  saveState();
  toast("Ok, hẹn bạn 2 giờ nữa. App sẽ không phán xét đâu 😄");
  // Đặt setTimeout để hiện notification nếu được cho phép
  if("Notification" in window && Notification.permission === "granted"){
    setTimeout(()=>{
      const {item} = getLazyToday();
      new Notification("⏰ 60 giây tiếng Trung thôi!", {
        body: `${item.h} (${item.p}) - ${item.m}`,
        icon:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🀄%3C/text%3E%3C/svg%3E"
      });

window.requestLazyNotif = function(){
  if(!("Notification" in window)){ toast("Trình duyệt không hỗ trợ","err"); return; }
  Notification.requestPermission().then(p=>{
    if(p==="granted"){
      toast("✅ Đã bật thông báo! Bạn sẽ được nhắc lúc "+S.lazyHour+":00");
      new Notification("🀄 Bật thông báo thành công!", {body:"Bạn sẽ được nhắc mỗi ngày lúc "+S.lazyHour+":00"});
      scheduleLazyNotif();
      render("lazy");
    } else {
      toast("Bạn đã từ chối thông báo","err");
    }
  });
};

// Lên lịch nhắc nhở mỗi ngày vào lazyHour (chỉ chạy khi app đang mở)
let _lazyNotifTimer = null;
function scheduleLazyNotif(){
  if(_lazyNotifTimer) clearTimeout(_lazyNotifTimer);
  if(!("Notification" in window) || Notification.permission !== "granted") return;
  const now = new Date();
  const target = new Date();
  target.setHours(S.lazyHour, 0, 0, 0);
  if(target <= now) target.setDate(target.getDate()+1); // ngày mai nếu đã qua giờ
  const delay = target - now;
  _lazyNotifTimer = setTimeout(()=>{
    const {date, item} = getLazyToday();
    if(!S.lazyDone[date]){
      new Notification("🀄 60 giây tiếng Trung thôi!", {
        body: `${item.h} (${item.p}) - ${item.m}\nLười thì lười chứ streak đừng bể nha!`,
        requireInteraction: false
      });
    }
    scheduleLazyNotif(); // lặp cho ngày hôm sau
  }, delay);
}

window.playDialogueSeq = async function(lines){
  for(const l of lines){
    await new Promise(res=>{
      speak(l);
      setTimeout(res, Math.max(1200, l.length*350));
    });
  }
};

window.exPracticeSpeak = function(hanzi, pinyin){
  const resEl = document.getElementById("exMicResult");
  const micBtn = document.getElementById("exMic");
  resEl.textContent = "🎙️ Đang nghe...";
  micBtn.classList.add("rec");
  listenOnce((text)=>{
    const r = scorePronunciation(hanzi, text);
    const color = r.score>=80?'#166534':r.score>=50?'#ca8a04':'#991b1b';
    resEl.innerHTML = `<b style="color:${color}">${r.score}/100</b> · ${r.detail} · bạn nói: "${r.recognized||'(không rõ)'}"`;
    if(r.score>=70){ addXP(5); toast("Phát âm tốt! +5 XP"); }
  }, ()=>{
    micBtn.classList.remove("rec");
    if(!resEl.innerHTML.includes("bạn nói")) resEl.textContent = "❌ Không nhận được âm thanh. Thử lại.";
  });
};

window.completeExpressDay = function(dayNum){
  if(!S.completedExpress.includes(dayNum)){
    S.completedExpress.push(dayNum);
    addXP(20);
    saveState();
    toast("🎉 Hoàn thành ngày "+dayNum+"! +20 XP");
    setTimeout(function(){ showNextStepToast("Cấp tốc ngày "+dayNum); }, 1000);
  }
  // Tự nhảy sang ngày kế tiếp nếu có
  if(dayNum<30){
    setTimeout(()=>openExpressDay(dayNum+1), 800);
  } else {
    setTimeout(()=>{ toast("🏆 Chúc mừng! Hoàn thành 30 ngày cấp tốc!"); nav('express'); }, 800);
  }
};

/* =====================================================
   11b. VIEW: TIMELINE 90 NGÀY ĐẾN HSK5
   ===================================================== */
// Timeline data: 90 ngày chia thành các giai đoạn
const TIMELINE_90 = (function(){
  const plan = [];
  // Giai đoạn 1: HSK1 (Ngày 1-12) - 5 bài × ~2-3 ngày/bài
  const hsk1Lessons = LESSONS.filter(l=>l.level===1);
  let day = 1;
  hsk1Lessons.forEach((lesson,i) => {
    // Ngày 1: vocab + listen
    plan.push({day:day, lv:1, lessonId:lesson.id, title:lesson.title, steps:["vocab","listen"], label:"Từ mới & Nghe", icon:"📖", extra:"Học từ mới + nghe hội thoại"});
    day++;
    // Ngày 2: read + speak + quiz
    plan.push({day:day, lv:1, lessonId:lesson.id, title:lesson.title, steps:["read","speak","quiz"], label:"Đọc, Nói & Quiz", icon:"🎯", extra:"Luyện đọc + nói + kiểm tra"});
    day++;
    // Bài cuối HSK1: thêm ngày ôn tập
    if(i === hsk1Lessons.length - 1){
      plan.push({day:day, lv:1, lessonId:null, title:"Ôn tập HSK 1", steps:[], label:"Ôn tập & Test HSK1", icon:"🏆", extra:"Ôn flashcards + Làm bài kiểm tra HSK 1", isReview:true, testLv:1});
      day++;
    }
  });

  // Giai đoạn 2: HSK2 (Ngày 13-50) - 23 bài × ~1.5 ngày/bài + ôn tập
  const hsk2Lessons = LESSONS.filter(l=>l.level===2);
  hsk2Lessons.forEach((lesson,i) => {
    if(i % 2 === 0){
      // Bài lẻ: 1 ngày full
      plan.push({day:day, lv:2, lessonId:lesson.id, title:lesson.title, steps:["vocab","listen","read"], label:"Học bài mới", icon:"📚", extra:"Từ mới + Nghe + Đọc"});
      day++;
      plan.push({day:day, lv:2, lessonId:lesson.id, title:lesson.title, steps:["speak","quiz"], label:"Luyện nói & Quiz", icon:"🗣️", extra:"Nói + Kiểm tra"});
      day++;
    } else {
      // Bài chẵn: 1 ngày gộp
      plan.push({day:day, lv:2, lessonId:lesson.id, title:lesson.title, steps:["vocab","listen","read","speak","quiz"], label:"Học trọn bài", icon:"⚡", extra:"Hoàn thành cả 5 bước"});
      day++;
    }
    // Ôn tập mỗi 8 bài
    if((i+1) % 8 === 0 && i < hsk2Lessons.length - 1){
      plan.push({day:day, lv:2, lessonId:null, title:"Ôn tập giữa kỳ HSK2", steps:[], label:"Ôn tập", icon:"🔄", extra:"Ôn flashcards + quiz tổng hợp", isReview:true});
      day++;
    }
  });
  // Test HSK2
  plan.push({day:day, lv:2, lessonId:null, title:"Kiểm tra HSK 2", steps:[], label:"Test HSK 2", icon:"🏆", extra:"Làm bài kiểm tra HSK 2", isReview:true, testLv:2});
  day++;

  // Giai đoạn 3: HSK3 (còn lại đến ngày 87) - 20 bài
  const hsk3Lessons = LESSONS.filter(l=>l.level===3);
  hsk3Lessons.forEach((lesson,i) => {
    if(i % 3 === 0){
      plan.push({day:day, lv:3, lessonId:lesson.id, title:lesson.title, steps:["vocab","listen","read"], label:"Học bài mới", icon:"📚", extra:"Từ mới + Nghe + Đọc"});
      day++;
      plan.push({day:day, lv:3, lessonId:lesson.id, title:lesson.title, steps:["speak","quiz"], label:"Luyện & Quiz", icon:"🗣️", extra:"Nói + Kiểm tra"});
      day++;
    } else {
      plan.push({day:day, lv:3, lessonId:lesson.id, title:lesson.title, steps:["vocab","listen","read","speak","quiz"], label:"Học trọn bài", icon:"⚡", extra:"Hoàn thành 5 bước"});
      day++;
    }
    // Ôn tập mỗi 7 bài
    if((i+1) % 7 === 0 && i < hsk3Lessons.length - 1){
      plan.push({day:day, lv:3, lessonId:null, title:"Ôn tập giữa kỳ HSK3", steps:[], label:"Ôn tập", icon:"🔄", extra:"Ôn flashcards + quiz tổng hợp", isReview:true});
      day++;
    }
  });
  // Test HSK3
  plan.push({day:day, lv:3, lessonId:null, title:"Kiểm tra HSK 3", steps:[], label:"Test HSK 3", icon:"🏆", extra:"Làm bài kiểm tra HSK 3", isReview:true, testLv:3});
  day++;

  // Pad remaining days to 90 with review/practice
  while(plan.length < 90){
    plan.push({day:day, lv:3, lessonId:null, title:"Ôn tập tổng hợp", steps:[], label:"Ôn tập & luyện nói", icon:"🎓", extra:"Ôn từ vựng + Chat AI + Flashcards", isReview:true});
    day++;
  }
  // Ensure exactly 90 entries, trim excess
  return plan.slice(0,90);
})();

VIEWS.timeline = function(){
  const today = new Date().toISOString().slice(0,10);

  // Tính ngày hiện tại trong timeline
  let currentDay = S.timelineDay || 0;
  if(S.timelineStart){
    const start = new Date(S.timelineStart);
    const now = new Date(today);
    const diff = Math.floor((now - start) / 86400000);
    currentDay = Math.max(currentDay, diff + 1);
  }

  // Tính số ngày đã hoàn thành (dựa trên roadmap progress)
  function isDayDone(dayPlan){
    if(!dayPlan.lessonId) return S.timelineDay >= dayPlan.day;
    const r = S.roadmap[dayPlan.lessonId] || {};
    return dayPlan.steps.every(s => r[s]);
  }

  const totalDone = TIMELINE_90.filter(d => isDayDone(d)).length;
  const pct = Math.round(totalDone / 90 * 100);

  // Tìm ngày hiện tại cần học
  const todayPlan = TIMELINE_90.find(d => !isDayDone(d)) || TIMELINE_90[TIMELINE_90.length-1];
  const todayIdx = todayPlan ? todayPlan.day : 90;

  let html = `
    <h1>📅 Lộ trình 90 ngày đến HSK 5</h1>
    <p class="sub">Mỗi ngày 1 bước nhỏ, 3 tháng chinh phục tiếng Trung!</p>

    <div class="panel" style="margin-bottom:20px;padding:18px;background:linear-gradient(135deg,#fdf2f8,#fce7f3);border-radius:16px;border:1px solid #fbcfe8">
      <div class="row" style="justify-content:space-between;margin-bottom:10px">
        <div>
          <div style="font-size:14px;color:#9d174d;font-weight:600">Tiến trình tổng</div>
          <div style="font-size:28px;font-weight:800;color:#831843">${totalDone}/90 ngày</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:40px">${pct >= 100 ? '🎓' : pct >= 60 ? '🔥' : pct >= 30 ? '💪' : '🌱'}</div>
          <div style="font-size:13px;color:#9d174d">${pct}%</div>
        </div>
      </div>
      <div style="background:#fff;border-radius:10px;height:14px;overflow:hidden">
        <div style="background:linear-gradient(90deg,#ec4899,#db2777);height:100%;width:${pct}%;border-radius:10px;transition:width 0.5s"></div>
      </div>
    </div>
  `;

  // Nút bắt đầu nếu chưa start
  if(!S.timelineStart){
    html += `
      <div class="card" style="text-align:center;padding:32px;border:2px dashed #ec4899">
        <div style="font-size:48px;margin-bottom:12px">🚀</div>
        <h2 style="margin:0 0 8px;color:#831843">Sẵn sàng chinh phục HSK 5?</h2>
        <p style="color:var(--muted);margin:0 0 20px">Lộ trình 90 ngày: HSK1 → HSK2 → HSK3 → Ôn tập tổng hợp</p>
        <button class="btn btn-pri" onclick="startTimeline()" style="background:linear-gradient(90deg,#ec4899,#db2777);font-size:16px;padding:14px 32px">
          Bắt đầu ngay hôm nay! 🎯
        </button>
      </div>
    `;
    MAIN.innerHTML = html;
    return;
  }

  // Highlight ngày hôm nay
  html += `
    <div class="card" style="border:2px solid #ec4899;background:linear-gradient(135deg,#fdf2f8,#fff);margin-bottom:20px;padding:20px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
        <div style="width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#ec4899,#db2777);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800">
          ${todayIdx}
        </div>
        <div style="flex:1">
          <div style="font-size:11px;color:#ec4899;font-weight:600;text-transform:uppercase">Hôm nay - Ngày ${todayIdx}</div>
          <div style="font-size:18px;font-weight:700;color:#831843">${todayPlan.icon} ${todayPlan.title}</div>
          <div style="font-size:13px;color:var(--muted)">${todayPlan.extra}</div>
        </div>
      </div>
  `;

  // Actions for today
  if(todayPlan.lessonId){
    const stepsLabel = todayPlan.steps.map(s => s==="vocab"?"Từ mới":s==="listen"?"Nghe":s==="read"?"Đọc":s==="speak"?"Nói":"Quiz").join(" → ");
    html += `
      <div style="background:#f8fafc;border-radius:10px;padding:12px;margin-bottom:12px">
        <div style="font-size:12px;color:var(--muted);margin-bottom:4px">Các bước hôm nay:</div>
        <div style="font-size:14px;font-weight:600">${stepsLabel}</div>
      </div>
      <button class="btn btn-pri btn-block" onclick="openStation(${todayPlan.lessonId})" style="background:linear-gradient(90deg,#ec4899,#db2777)">
        Bắt đầu học →
      </button>
    `;
  } else if(todayPlan.testLv){
    html += `
      <button class="btn btn-pri btn-block" onclick="startLevelTest(${todayPlan.testLv})" style="background:linear-gradient(90deg,#ec4899,#db2777)">
        📝 Làm bài kiểm tra HSK ${todayPlan.testLv}
      </button>
    `;
  } else {
    html += `
      <div class="row" style="gap:8px">
        <button class="btn btn-pri" onclick="nav('flashcards')" style="flex:1;background:#7c3aed">🃏 Flashcards</button>
        <button class="btn btn-pri" onclick="nav('chat')" style="flex:1;background:#0284c7">💬 Chat AI</button>
        <button class="btn btn-pri" onclick="nav('quiz')" style="flex:1;background:#ea580c">🎯 Quiz</button>
      </div>
    `;
  }
  html += `</div>`;

  // Đánh dấu hoàn thành
  if(!isDayDone(todayPlan)){
    html += `
      <button class="btn btn-ok btn-block" onclick="markTimelineDay(${todayIdx})" style="margin-bottom:20px;padding:14px;font-size:15px">
        ✅ Đánh dấu Ngày ${todayIdx} hoàn thành
      </button>
    `;
  } else {
    html += `
      <div style="text-align:center;padding:12px;background:#d1fae5;border-radius:12px;margin-bottom:20px;color:#065f46;font-weight:600">
        ✅ Ngày ${todayIdx} đã hoàn thành! Ngày mai học tiếp nhé!
      </div>
    `;
  }

  // Timeline visual - chia theo giai đoạn
  const phases = [
    {name:"HSK 1 · Cơ bản", color:"#10b981", bg:"#d1fae5", days:[1,12]},
    {name:"HSK 2 · Giao tiếp", color:"#f59e0b", bg:"#fef3c7", days:[13,50]},
    {name:"HSK 3 · Nâng cao", color:"#6366f1", bg:"#e0e7ff", days:[51,87]},
    {name:"Ôn tập tổng hợp", color:"#ec4899", bg:"#fce7f3", days:[88,90]},
  ];

  phases.forEach(phase => {
    const phDays = TIMELINE_90.filter(d => d.day >= phase.days[0] && d.day <= phase.days[1]);
    const phDone = phDays.filter(d => isDayDone(d)).length;

    html += `
      <div style="margin-bottom:16px">
        <div style="background:${phase.bg};border-radius:10px;padding:10px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
          <b style="color:${phase.color};font-size:14px">${phase.name}</b>
          <span style="font-size:12px;color:var(--muted)">${phDone}/${phDays.length} ngày</span>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:4px;padding:0 4px">
    `;

    phDays.forEach(d => {
      const done = isDayDone(d);
      const isCurrent = d.day === todayIdx && !done;
      const bg = done ? phase.color : isCurrent ? '#fff' : '#f1f5f9';
      const border = isCurrent ? `2px solid ${phase.color}` : 'none';
      const color = done ? '#fff' : isCurrent ? phase.color : '#94a3b8';
      const cursor = done || isCurrent ? 'pointer' : 'default';
      const opacity = (d.day > todayIdx + 3 && !done) ? '0.5' : '1';
      html += `<div onclick="showTimelineDay(${d.day})" style="width:100%;aspect-ratio:1;border-radius:8px;background:${bg};border:${border};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:${color};cursor:${cursor};opacity:${opacity}" title="Ngày ${d.day}: ${d.title}">${done?'✓':d.day}</div>`;
    });

    html += `</div></div>`;
  });

  MAIN.innerHTML = html;
};

window.startTimeline = function(){
  S.timelineStart = new Date().toISOString().slice(0,10);
  S.timelineDay = 1;
  saveState();
  toast("🎯 Bắt đầu lộ trình 90 ngày!");
  render("timeline");
};

window.markTimelineDay = function(day){
  S.timelineDay = Math.max(S.timelineDay || 0, day);
  saveState();
  addXP(20);
  toast("✅ Ngày " + day + " hoàn thành! +20 XP");
  render("timeline");
};

window.showTimelineDay = function(day){
  const d = TIMELINE_90[day - 1];
  if(!d) return;
  // Scroll to top and show detail
  const detail = document.createElement("div");
  detail.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px";
  let inner = '<div style="background:#fff;border-radius:16px;max-width:400px;width:100%;padding:24px;position:relative">';
  inner += '<button onclick="this.closest(\'div[style*=fixed]\').remove()" style="position:absolute;top:12px;right:12px;font-size:20px;cursor:pointer;border:0;background:none">✕</button>';
  inner += '<div style="font-size:36px;text-align:center;margin-bottom:8px">' + d.icon + '</div>';
  inner += '<h3 style="text-align:center;margin:0 0 4px">Ngày ' + d.day + '</h3>';
  inner += '<div style="text-align:center;font-size:15px;font-weight:600;color:#831843;margin-bottom:8px">' + d.title + '</div>';
  inner += '<div style="text-align:center;font-size:13px;color:var(--muted);margin-bottom:16px">' + d.extra + '</div>';
  if(d.steps.length > 0){
    inner += '<div style="background:#f8fafc;border-radius:10px;padding:12px;margin-bottom:12px;text-align:center">';
    inner += '<div style="font-size:12px;color:var(--muted);margin-bottom:4px">Bước cần làm:</div>';
    inner += '<div style="font-size:14px;font-weight:600">' + d.steps.map(function(s){return s==="vocab"?"Từ mới":s==="listen"?"Nghe":s==="read"?"Đọc":s==="speak"?"Nói":"Quiz"}).join(" → ") + '</div>';
    inner += '</div>';
  }
  if(d.lessonId){
    inner += '<button class="btn btn-pri btn-block" onclick="this.closest(\'div[style*=fixed]\').remove();openStation(' + d.lessonId + ')" style="background:linear-gradient(90deg,#ec4899,#db2777)">Vào học →</button>';
  } else if(d.testLv){
    inner += '<button class="btn btn-pri btn-block" onclick="this.closest(\'div[style*=fixed]\').remove();startLevelTest(' + d.testLv + ')" style="background:linear-gradient(90deg,#ec4899,#db2777)">📝 Làm bài test HSK ' + d.testLv + '</button>';
  }
  inner += '</div>';
  detail.innerHTML = inner;
  detail.addEventListener("click", function(e){ if(e.target === detail) detail.remove(); });
  document.body.appendChild(detail);
};

VIEWS.book = function(){
  MAIN.innerHTML = `
    <h1 style="text-align:center">📖 Sách Học</h1>
    <p class="sub" style="text-align:center">Chọn bài để mở sách</p>
    <div id="bookShelf" style="display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-top:20px"></div>
  `;
  const shelf = document.getElementById("bookShelf");
  BOOK_CHAPTERS.forEach(ch=>{
    const book = document.createElement("div");
    book.style.cssText = "width:130px;cursor:pointer;text-align:center;transition:transform .2s";
    book.innerHTML = `
      <div style="width:110px;height:150px;margin:0 auto;background:linear-gradient(135deg,#fef3c7,#fde68a);border-radius:4px 12px 12px 4px;border-left:6px solid #b45309;box-shadow:2px 2px 8px rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px">
        <div style="font-size:36px">${ch.icon}</div>
        <div style="font-size:12px;font-weight:700;color:#78350f;margin-top:8px;line-height:1.3">${ch.title}</div>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:6px">${ch.words.reduce((s,w)=>s+w.rows.length,0)} trang</div>
    `;
    book.onmouseenter = ()=>book.style.transform="translateY(-6px) scale(1.05)";
    book.onmouseleave = ()=>book.style.transform="";
    book.onclick = ()=>openBookReader(ch);
    shelf.appendChild(book);
  });
};

  pages.push({type:"cover", title:ch.title, icon:ch.icon, total:ch.words.reduce((s,w)=>s+w.rows.length,0)});
  ch.words.forEach(wg=>{
    pages.push({type:"diagram", base:wg.base, rows:wg.rows});
  });
  pages.push({type:"end", title:ch.title});
  return pages;
}

window.playBookPage = function(words){
  let i = 0;
  const btn = document.querySelector('[onclick*="playBookPage"]');
  if(btn) btn.innerHTML = "🔊 Đang đọc...";
  function next(){
    if(i >= words.length){
      if(btn) btn.innerHTML = "🔊 Đọc toàn bộ trang";
      return;
    }
    speak(words[i]);
    i++;
    const delay = words[i-1].length > 4 ? 2500 : 1500;
    setTimeout(next, delay);
  }
  next();
};

function openBookReader(ch){
  const pages = buildBookPages(ch);
  let cur = 0;
  function show(){
    MAIN.innerHTML = `
      <div style="max-width:900px;margin:0 auto">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <button class="btn btn-ghost" onclick="nav('book')" style="font-size:13px">✕ Đóng sách</button>
          <span style="font-size:12px;color:var(--muted)">${ch.title}</span>
        </div>
        <div id="bookPage" style="background:linear-gradient(to right,#fffbeb,#fefce8,#fffbeb);border:1px solid #d6d3d1;border-radius:4px 16px 16px 4px;box-shadow:4px 0 12px rgba(0,0,0,.08),-2px 0 4px rgba(0,0,0,.03);padding:32px 36px;min-height:520px;position:relative;overflow:hidden">
          <div style="position:absolute;top:0;left:0;width:8px;height:100%;background:linear-gradient(to right,#d4a574,#e8c99b,transparent)"></div>
          <div style="margin-left:12px" id="pageContent">
            ${renderBookPage(pages[cur], cur, pages.length)}
          </div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px">
          <button class="btn btn-ghost" id="prevBtn" ${cur===0?'disabled style="opacity:.3;pointer-events:none;font-size:14px"':'style="font-size:14px"'} onclick="window._bookPrev()">◀ Trang trước</button>
          <div style="display:flex;gap:4px">
            ${pages.map((_,i)=>`<div style="width:${i===cur?'16px':'6px'};height:6px;border-radius:3px;background:${i===cur?'#b45309':'#d6d3d1'};transition:all .2s"></div>`).join("")}
          </div>
          <button class="btn btn-ghost" id="nextBtn" ${cur===pages.length-1?'disabled style="opacity:.3;pointer-events:none;font-size:14px"':'style="font-size:14px"'} onclick="window._bookNext()">Trang sau ▶</button>
        </div>
      </div>
    `;
  }
  window._bookNext = function(){ if(cur<pages.length-1){cur++; show();} };
  window._bookPrev = function(){ if(cur>0){cur--; show();} };
  show();
}

window.exportData = function(){
  S.lastBackup = new Date().toISOString().slice(0,10);
  saveState();
  const blob = new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "chinese-learning-"+new Date().toISOString().slice(0,10)+".json";
  a.click();
  toast("💾 Đã xuất file backup!");
};
window.importData = function(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{ S = Object.assign(defaultState(), JSON.parse(r.result)); saveState(); toast("Đã nhập dữ liệu"); render("dashboard"); }
    catch(e){ toast("File không hợp lệ","err"); }
  };
  r.readAsText(f);
};
window.resetAll = function(){
  if(confirm("Xoá toàn bộ tiến độ học? Không thể khôi phục.")){
    S = defaultState(); saveState(); toast("Đã reset"); render("dashboard");
  }
};

/* --- SYNC FILE: đồng bộ bằng file JSON (khuyên dùng) --- */
window.exportSyncFile = function(){
  const data = JSON.stringify(S, null, 0);
  const blob = new Blob([data], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const d = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = "hoc-tieng-trung-"+d+".json";
  a.click();
  URL.revokeObjectURL(url);
  toast("Đã tải file! Gửi file qua Zalo/Messenger sang điện thoại.");
  const area = document.getElementById("syncArea");
  area.innerHTML = `
    <div style="background:#f0fdf4;border:2px solid #22c55e;border-radius:10px;padding:14px;margin-top:8px">
      <p style="margin:0;font-size:13px"><b>Bước tiếp:</b></p>
      <ol style="margin:6px 0 0;padding-left:20px;font-size:13px;line-height:1.8">
        <li>Gửi file <b>hoc-tieng-trung-${d}.json</b> qua Zalo/Messenger</li>
        <li>Mở điện thoại → tải file về</li>
        <li>Mở app → Cài đặt → <b>"Nhập file từ máy khác"</b> → chọn file</li>
      </ol>
    </div>
  `;
};
window.importSyncFile = function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    try {
      const imported = JSON.parse(ev.target.result);
      if(!imported || typeof imported !== "object") throw "bad";
      S = Object.assign(defaultState(), imported);
      saveState();
      toast("Đồng bộ thành công! Đã nhập tiến độ học.");
      render("settings");
    } catch(err){
      toast("File không hợp lệ. Kiểm tra lại!","err");
    }
  };
  reader.readAsText(file);
};

/* --- SYNC CODE: đồng bộ bằng mã ngắn gọn --- */
/* Chỉ lưu key viết tắt + dữ liệu thay đổi → base64 an toàn */
const _syncKeys={xp:"a",streak:"b",lastDay:"c",studyDays:"d",completedLessons:"e",vocabSRS:"f",mistakes:"g",quizHistory:"h",settings:"i",speakingScores:"j",dailyDone:"k",completedExpress:"l",expressStart:"m",lazyDone:"n",lazyHour:"o",roadmap:"p",todayFlashcards:"q",todayRoadmapDone:"r",milestones:"s",levelTestPassed:"t",timelineDay:"u",timelineStart:"v"};
const _syncKeysR={};for(const k in _syncKeys)_syncKeysR[_syncKeys[k]]=k;

window.generateSyncCode = function(){
  const essential = {};
  const def = defaultState();
  for(const k in S){
    if(JSON.stringify(S[k]) !== JSON.stringify(def[k])){
      const short = _syncKeys[k] || k;
      essential[short] = S[k];
    }
  }
  const json = JSON.stringify(essential);
  const code = btoa(unescape(encodeURIComponent(json)));
  const area = document.getElementById("syncArea");
  area.innerHTML = `
    <div style="background:#f0fdf4;border:2px solid #22c55e;border-radius:10px;padding:14px">
      <div style="font-weight:600;color:#059669;margin-bottom:8px">📤 Mã đồng bộ (${code.length} ký tự):</div>
      <textarea id="syncCode" readonly style="width:100%;height:80px;font-size:11px;font-family:monospace;border:1px solid #d1d5db;border-radius:6px;padding:8px;resize:none">${code}</textarea>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn btn-pri" onclick="copySyncCode()" style="flex:1">📋 Copy mã</button>
        <button class="btn btn-ghost" onclick="shareSyncCode()" style="flex:1">📤 Chia sẻ</button>
      </div>
      <p style="font-size:11px;color:var(--muted);margin:8px 0 0">Copy → gửi qua Zalo/Messenger → mở app trên điện thoại → Cài đặt → Nhập mã</p>
    </div>
  `;
};
window.copySyncCode = function(){
  const el = document.getElementById("syncCode");
  if(navigator.clipboard){
    navigator.clipboard.writeText(el.value).then(()=>toast("Đã copy mã đồng bộ!"));
  } else {
    el.select(); document.execCommand("copy"); toast("Đã copy mã đồng bộ!");
  }
};
window.shareSyncCode = function(){
  const code = document.getElementById("syncCode").value;
  if(navigator.share){
    navigator.share({title:"Mã đồng bộ học tiếng Trung", text:code}).catch(()=>{});
  } else {
    copySyncCode();
  }
};
window.showImportSync = function(){
  const area = document.getElementById("syncArea");
  area.innerHTML = `
    <div style="background:#eff6ff;border:2px solid #3b82f6;border-radius:10px;padding:14px">
      <div style="font-weight:600;color:#1e40af;margin-bottom:8px">📥 Dán mã từ máy khác:</div>
      <textarea id="syncInput" placeholder="Dán mã đồng bộ vào đây..." style="width:100%;height:80px;font-size:11px;font-family:monospace;border:1px solid #d1d5db;border-radius:6px;padding:8px;resize:none"></textarea>
      <button class="btn btn-pri" onclick="applySyncCode()" style="margin-top:8px">✅ Nhập dữ liệu</button>
    </div>
  `;
};
window.applySyncCode = function(){
  try {
    const code = document.getElementById("syncInput").value.replace(/\s+/g,"").trim();
    if(!code){ toast("Chưa dán mã!","err"); return; }
    const json = decodeURIComponent(escape(atob(code)));
    const raw = JSON.parse(json);
    /* Giải mã key viết tắt → key đầy đủ */
    const imported = {};
    for(const k in raw){
      const fullKey = _syncKeysR[k] || k;
      imported[fullKey] = raw[k];
    }
    S = Object.assign(defaultState(), imported);
    saveState();
    toast("Đồng bộ thành công! Đã nhập tiến độ học.");
    render("dashboard");
  } catch(e){
    toast("Mã không hợp lệ. Kiểm tra lại!","err");
  }
};

/* --- DRIVE MODE: học bằng audio khi lái xe --- */
let _driveTimer = null;
let _driveRunning = false;
window.startDriveMode = function(){
  const pool = VOCAB.filter(v=>v.t&&v.t.includes("hsk1")).slice(0,80);
  if(pool.length<10) pool.push(...VOCAB.slice(0,30));
  const items = pool.sort(()=>Math.random()-0.5).slice(0,30);
  _driveRunning = true;

  MAIN.innerHTML = `
    <div style="max-width:600px;margin:0 auto;text-align:center;padding:20px 0">
      <div style="font-size:60px;margin-bottom:16px">🚗</div>
      <h1 style="font-size:28px">Chế độ lái xe</h1>
      <p style="color:var(--muted);font-size:15px;margin:10px 0 24px">Đặt điện thoại xuống — chỉ nghe và nhắc lại</p>
      <div id="driveCard" style="background:linear-gradient(135deg,#ecfdf5,#d1fae5);border:3px solid #22c55e;border-radius:20px;padding:40px 30px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center">
        <div id="driveWord" style="font-size:48px;font-weight:700;color:#dc2626"></div>
        <div id="drivePinyin" style="font-size:22px;color:#6d28d9;margin:8px 0"></div>
        <div id="driveMeaning" style="font-size:20px;color:#059669"></div>
        <div id="driveStatus" style="font-size:15px;color:var(--muted);margin-top:16px">Chuẩn bị...</div>
      </div>
      <div id="driveProgress" style="margin:20px 0;font-size:14px;color:var(--muted)"></div>
      <div style="display:flex;gap:12px;justify-content:center;margin-top:16px">
        <button class="btn btn-ghost" onclick="stopDriveMode()" style="font-size:16px;padding:12px 24px">⏹ Dừng</button>
        <button class="btn btn-ghost" onclick="toggleDrivePause()" id="drivePauseBtn" style="font-size:16px;padding:12px 24px">⏸ Tạm dừng</button>
      </div>
    </div>
  `;

  let idx = 0;
  let paused = false;
  window.toggleDrivePause = function(){
    paused = !paused;
    document.getElementById("drivePauseBtn").innerHTML = paused ? "▶ Tiếp tục" : "⏸ Tạm dừng";
    if(!paused) playNext();
  };

  function playNext(){
    if(!_driveRunning || paused) return;
    if(idx >= items.length){
      document.getElementById("driveStatus").textContent = "Hoàn thành! 🎉";
      document.getElementById("driveWord").textContent = "🎉";
      document.getElementById("drivePinyin").textContent = "Giỏi lắm!";
      document.getElementById("driveMeaning").textContent = "Đã học " + items.length + " từ";
      addXP(20);
      _driveRunning = false;
      return;
    }
    const v = items[idx];
    document.getElementById("driveWord").textContent = v.h;
    document.getElementById("drivePinyin").textContent = v.p;
    document.getElementById("driveMeaning").textContent = v.m;
    document.getElementById("driveProgress").textContent = "Từ " + (idx+1) + " / " + items.length;

    document.getElementById("driveStatus").textContent = "🔊 Đang đọc...";
    speak(v.h);

    setTimeout(()=>{
      if(!_driveRunning || paused) return;
      document.getElementById("driveStatus").textContent = "🎙️ Bạn nhắc lại...";
      setTimeout(()=>{
        if(!_driveRunning || paused) return;
        document.getElementById("driveStatus").textContent = "🔊 Đọc lại lần nữa...";
        speak(v.h);
        setTimeout(()=>{
          if(!_driveRunning || paused) return;
          idx++;
          document.getElementById("driveStatus").textContent = "⏳ Từ tiếp theo...";
          setTimeout(playNext, 1500);
        }, 2500);
      }, 3000);
    }, 2500);
  }

  setTimeout(playNext, 1500);
};
window.stopDriveMode = function(){
  _driveRunning = false;
  if(_driveTimer) clearTimeout(_driveTimer);
  toast("Đã dừng chế độ lái xe");
  render("settings");
};

/* =====================================================
   12.5 HƯỚNG DẪN HỌC (LEARNING GUIDE)
   ===================================================== */
/* --- Smart Coach: biết bạn đang ở đâu, gợi ý bước tiếp theo --- */
function getNextStep(){
  var today = new Date().toISOString().slice(0,10);
  var lazyDone = !!S.lazyDone[today];
  var quizDone = S.dailyDone === today;
  var learnedCount = Object.keys(S.vocabSRS).length;

  // Priority 1: Chế độ lười hôm nay chưa làm
  if(!lazyDone) return {icon:"😴",title:"Học 1 câu mỗi ngày",desc:"Chỉ 60 giây thôi – giữ streak nào!",action:"nav('lazy')",btn:"60s thôi →",color:"#f59e0b",bg:"linear-gradient(135deg,#fef3c7,#fde68a)",priority:1};

  // Priority 2: Lộ trình - tìm bài tiếp theo chưa hoàn thành
  if(typeof stationUnlocked==="function"){
    for(var i=0;i<LESSONS.length;i++){
      var lid = LESSONS[i].id;
      if(stationUnlocked(lid) && !stationDone(lid)){
        var prog = stationProgress(lid);
        var stepNames = ["Từ mới","Nghe","Đọc hiểu","Nói","Quiz"];
        var nextStepIdx = 0;
        var rm = S.roadmap[lid] || {};
        var stKeys = ["vocab","listen","read","speak","quiz"];
        for(var k=0;k<stKeys.length;k++){ if(!rm[stKeys[k]]){nextStepIdx=k;break;} }
        return {icon:"🗺️",title:"Lộ trình: Bài "+lid+" – "+LESSONS[i].title,desc:"Bước tiếp: "+stepNames[nextStepIdx]+" ("+Math.round(prog*100)+"% xong)",action:"nav('roadmap')",btn:"Tiếp tục →",color:"#4f46e5",bg:"linear-gradient(135deg,#eef2ff,#e0e7ff)",priority:2};
      }
    }
  }

  // Priority 3: Daily Quiz chưa làm
  if(!quizDone) return {icon:"🎯",title:"Daily Quiz hôm nay",desc:"8 câu, 5 phút, +50 XP!",action:"nav('quiz')",btn:"Làm quiz →",color:"#ea580c",bg:"linear-gradient(135deg,#fff7ed,#fed7aa)",priority:3};

  // Priority 4: Flashcards ôn tập
  if(learnedCount >= 5) return {icon:"🃏",title:"Ôn tập Flashcards",desc:"Bạn đã học "+learnedCount+" từ – lật thẻ nhớ lâu hơn!",action:"nav('flashcards')",btn:"Ôn tập →",color:"#7c3aed",bg:"linear-gradient(135deg,#f5f3ff,#ede9fe)",priority:4};

  // Priority 5: Chat AI
  return {icon:"💬",title:"Luyện nói với AI",desc:"Thử hội thoại trong tình huống thực tế!",action:"nav('chat')",btn:"Chat →",color:"#0284c7",bg:"linear-gradient(135deg,#e0f2fe,#bae6fd)",priority:5};
}

window.showNextStepToast = function(justCompleted){
  var next = getNextStep();
  var completedMsg = justCompleted ? '<div style="color:#166534;font-weight:700;margin-bottom:8px">✅ '+justCompleted+'</div>' : '';
  var el = document.createElement("div");
  el.style.cssText = "position:fixed;bottom:90px;right:12px;left:12px;z-index:9998;background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.2);padding:16px;max-width:380px;margin-left:auto;animation:slideUp .4s ease;border-left:4px solid "+next.color;
  el.innerHTML = completedMsg+'<div style="font-size:14px;font-weight:700;color:#0f172a;margin-bottom:4px">'+next.icon+' Tiếp theo: '+next.title+'</div><div style="font-size:12px;color:#64748b;margin-bottom:10px">'+next.desc+'</div><div style="display:flex;gap:8px"><button onclick="this.parentElement.parentElement.remove();'+next.action+'" style="padding:8px 14px;background:'+next.color+';color:#fff;border:0;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer">'+next.btn+'</button><button onclick="this.parentElement.parentElement.remove()" style="padding:8px 14px;background:#f1f5f9;color:#64748b;border:0;border-radius:8px;font-size:13px;cursor:pointer">Để sau</button></div>';
  document.body.appendChild(el);
  setTimeout(function(){ if(el.parentElement) el.remove(); }, 12000);
};
